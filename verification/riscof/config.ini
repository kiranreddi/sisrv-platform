[RISCOF]
ReferencePlugin=spike
ReferencePluginPath=plugins/spike
DUTPlugin=sisrv
DUTPluginPath=plugins/sisrv

[sisrv]
pluginpath=plugins/sisrv
ispec=plugins/sisrv/sisrv_isa.yaml
pspec=plugins/sisrv/sisrv_platform.yaml
simulator=../../build/sim_sisPlatformTop
toolchain_prefix=riscv64-unknown-elf-
timeout_cycles=300000
jobs=8
target_run=1

[spike]
pluginpath=plugins/spike
ispec=plugins/sisrv/sisrv_isa.yaml
pspec=plugins/sisrv/sisrv_platform.yaml
toolchain_prefix=riscv64-unknown-elf-
PATH=
jobs=4
