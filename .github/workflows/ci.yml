name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      extended_compliance:
        description: "Run slow A/PMP/privilege ACT and rv32imac+U+PMP co-sim lanes"
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly extended compliance on the default branch after this workflow lands.
    - cron: "17 8 * * *"

permissions:
  contents: read

env:
  VERILATOR_REF: v5.050
  SPIKE_REF: 3d8eb089bd289c59dcb506f197a172e02beb7b5b
  COCOTB_VERSION: "2.0.1"
  # OpenSTA release tags can reject SWIG 4.x on ubuntu-latest; use tip.
  OPENSTA_REF: master

jobs:
  # Build Verilator once; consumers download the install prefix artifact.
  verilator:
    name: Build Verilator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache Verilator install
        id: cache-verilator
        uses: actions/cache@v6
        with:
          path: ~/.local/verilator
          key: verilator-${{ runner.os }}-${{ env.VERILATOR_REF }}-noccache1

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          PREFIX="$HOME/.local/verilator" VERILATOR_REF="$VERILATOR_REF" \
            bash scripts/ci/install_verilator.sh

      - name: Package install tree
        run: |
          test -x "$HOME/.local/verilator/bin/verilator"
          "$HOME/.local/verilator/bin/verilator" --version
          tar -C "$HOME/.local" -czf /tmp/verilator.tar.gz verilator

      - name: Upload Verilator artifact
        uses: actions/upload-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator.tar.gz
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Verilator Lint
    runs-on: ubuntu-latest
    needs: verilator
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version

      - name: Run Lint
        run: make lint

  regress:
    name: Assembly Regression (76 tests + pipeline guards)
    runs-on: ubuntu-latest
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install RISC-V Toolchain
        run: sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Run Regression
        run: make regress

      - name: Run Pipeline Throughput Guard
        run: make pipeline-throughput

      - name: Run Fetch-Buffer Throughput Guard
        run: make fetch-throughput

      - name: Run AXI-Lite Regression
        run: make regress-axil

      - name: Run Pipeline Debug Single-step Test
        run: make pipeline-debug

  cocotb:
    name: cocotb Tests (55 tests)
    runs-on: ubuntu-latest
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install cocotb
        run: python3 -m pip install --upgrade pip && python3 -m pip install "cocotb==${{ env.COCOTB_VERSION }}"

      - name: Run cocotb Tests
        run: |
          echo "=== cocotb Test Configuration ==="
          echo "Simulator backend: Verilator"
          verilator --version
          echo "DUT top modules: sisAlu, sisRegFile, sisDecode, sisDecompress, sisCsr, sisAxiLiteM, sisPmp"
          echo "================================"
          make cocotb

  uvm-verilator:
    name: UVM Verilator (Decompress + Platform)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version

      - name: Ensure UVM library present
        run: |
          if [ ! -f third_party/uvm/src/uvm.sv ]; then
            bash scripts/ci/fetch_uvm.sh
          fi
          test -f third_party/uvm/src/uvm.sv

      - name: UVM L0 Decompress smoke
        run: make uvm-decompress UVM_TEST=sis_decompress_smoke_test

      - name: UVM platform tohost (test_pass)
        run: |
          make sw
          make uvm-platform UVM_PLATFORM_TEST=sis_platform_tohost_test \
            UVM_ROM_HEX=build/tests/test_pass.hex

      - name: UVM platform regress (all asm)
        run: make uvm-platform-regress

  uvm-coverage:
    name: UVM Coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator + RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version

      - name: Ensure UVM library present
        run: |
          if [ ! -f third_party/uvm/src/uvm.sv ]; then
            bash scripts/ci/fetch_uvm.sh
          fi

      - name: UVM coverage (decompress + platform regress)
        run: make uvm-coverage

      - name: Upload UVM coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-uvm
          path: build/coverage/uvm/
          if-no-files-found: warn

  coverage-unit:
    name: Unit Coverage Baseline (informational)
    runs-on: ubuntu-latest
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version

      - name: Install cocotb
        run: python3 -m pip install --upgrade pip && python3 -m pip install "cocotb==${{ env.COCOTB_VERSION }}"

      - name: Run unit coverage (Decompress)
        run: make coverage-unit

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: build/coverage/
          if-no-files-found: warn

  # B2 triage: bounded rv32imac+U/PMP lock-step on every PR (full 10k stays nightly).
  cosim-lockstep-imac-upmp-smoke:
    name: Lock-step Smoke (rv32imac+U/PMP, 64 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-cosim-smoke
        uses: actions/cache@v6
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          PREFIX="$HOME/.local/spike" SPIKE_REF="$SPIKE_REF" bash scripts/ci/install_spike.sh
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"

      - name: Run 64-seed rv32imac+U/PMP lock-step smoke
        run: make cosim-lockstep-imac-upmp-smoke COSIM_SMOKE_SEEDS=64

  # Prebuilt RV32 firmware for hosts that cannot install a RISC-V toolchain.
  # Download artifact "sisrv-sw-artifacts", then:
  #   make sw-from-artifacts SW_ARTIFACTS_TGZ=.../sisrv-sw-artifacts.tar.gz
  # Use for Verilator directed runs, commercial/UVM TB (sisTbTop), future platform cocotb.
  sw-artifacts:
    name: Software Artifacts (UVM/cocotb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu

      - name: Build + package all asm hex/elf/dis
        run: make sw-artifacts

      - name: Upload sisrv-sw-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sisrv-sw-artifacts
          path: build/sw-artifacts/sisrv-sw-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked tree (browseable)
        uses: actions/upload-artifact@v4
        with:
          name: sisrv-sw-artifacts-tree
          path: build/sw-artifacts/tree/
          if-no-files-found: error
          retention-days: 14

  axil-stall-nightly:
    name: AXI-Lite 1000-seed Stall Nightly (M3)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended_compliance == true)
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install cocotb
        run: python3 -m pip install --upgrade pip && python3 -m pip install "cocotb==${{ env.COCOTB_VERSION }}"

      - name: Run 1000-seed AXI-Lite stall stress
        run: make cocotb-axil-stall-nightly AXIL_STALL_SEEDS=1000 AXIL_STALL_TXNS=100

  formal:
    name: Formal Verification (ALU + RegFile + Decoder + AXI-Lite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Install SymbiYosys + Yosys + z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 python3-pip git make
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install

      - name: Run Formal Proofs
        run: make formal

  synth:
    name: Yosys Synthesis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Run Synthesis
        run: |
          make synth
          test -s build/ppa_synth_report.txt
          head -40 build/ppa_synth_report.txt

      - name: Upload synthesis report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppa-synth-report
          path: build/ppa_synth_report.txt
          if-no-files-found: error

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install RISC-V Toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Run reduced benchmark validation
        run: |
          if command -v riscv64-unknown-elf-gcc >/dev/null; then
            make benchmark-smoke RV_PREFIX=riscv64-unknown-elf-
          else
            make benchmark-smoke
          fi

  cosim-lockstep:
    name: 10k-seed Lock-step Co-sim
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Independent of riscof-act: co-sim is its own functional check (lock-step vs Spike on
    # random programs) and builds its own Spike, so it should not be skipped when the ACT
    # suite is slow. Keep it gated on the fast functional jobs only.
    needs: [verilator, regress, cocotb, formal, synth, benchmark-smoke, sta-sky130]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-cosim
        uses: actions/cache@v6
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          PREFIX="$HOME/.local/spike" SPIKE_REF="$SPIKE_REF" bash scripts/ci/install_spike.sh
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"


      - name: Run 10k-seed lock-step co-sim
        run: make cosim-lockstep COSIM_SEEDS=10000

  cosim-lockstep-imac-upmp:
    name: 10k-seed Lock-step Co-sim (rv32imac + U/PMP)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended_compliance == true)
    needs: [verilator, regress, cocotb, formal, synth, benchmark-smoke, sta-sky130]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-cosim-imac-upmp
        uses: actions/cache@v6
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          PREFIX="$HOME/.local/spike" SPIKE_REF="$SPIKE_REF" bash scripts/ci/install_spike.sh
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"


      - name: Run 10k-seed rv32imac + U/PMP lock-step co-sim
        run: make cosim-lockstep-imac-upmp COSIM_SEEDS=10000

  riscof-act:
    name: RISCOF ACT (I/M/C/Zicsr CI subset, 95 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-riscof
        uses: actions/cache@v6
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          PREFIX="$HOME/.local/spike" SPIKE_REF="$SPIKE_REF" bash scripts/ci/install_spike.sh
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"


      - name: Install RISCOF Python stack
        run: |
          python3 -m venv .venv-riscof
          . .venv-riscof/bin/activate
          pip install -r verification/riscof/requirements.txt

      - name: Run RISCOF rv32imac_zicsr ACT suite
        run: |
          . .venv-riscof/bin/activate
          if command -v riscv64-unknown-elf-gcc >/dev/null; then
            export RV_PREFIX=riscv64-unknown-elf-
          else
            export RV_PREFIX=riscv64-linux-gnu-
          fi
          export RISCOF_TOOLCHAIN_PREFIX="$RV_PREFIX"
          make riscof-check-tools
          make build/sim_sisPlatformTop USE_AXIL=0
          make riscof-act

  riscof-act-full:
    name: RISCOF ACT Full (A/PMP/privilege opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended_compliance == true)
    needs: [verilator, lint]
    steps:
      - uses: actions/checkout@v5

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator-${{ env.VERILATOR_REF }}
          path: /tmp/verilator-art

      - name: Install Verilator from artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/verilator-art/verilator.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/verilator/bin" >> "$GITHUB_PATH"
          echo "VERILATOR_ROOT=$HOME/.local/verilator/share/verilator" >> "$GITHUB_ENV"
          "$HOME/.local/verilator/bin/verilator" --version


      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-riscof-full
        uses: actions/cache@v6
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          PREFIX="$HOME/.local/spike" SPIKE_REF="$SPIKE_REF" bash scripts/ci/install_spike.sh
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"


      - name: Install RISCOF Python stack
        run: |
          python3 -m venv .venv-riscof
          . .venv-riscof/bin/activate
          pip install -r verification/riscof/requirements.txt

      - name: Run full RISCOF rv32imac_zicsr ACT suite
        run: |
          . .venv-riscof/bin/activate
          if command -v riscv64-unknown-elf-gcc >/dev/null; then
            export RV_PREFIX=riscv64-unknown-elf-
          else
            export RV_PREFIX=riscv64-linux-gnu-
          fi
          export RISCOF_TOOLCHAIN_PREFIX="$RV_PREFIX"
          make riscof-check-tools
          make build/sim_sisPlatformTop USE_AXIL=0
          make riscof-act-full

  sta-sky130:
    name: Sky130 STA (WNS/TNS/Fmax)
    runs-on: ubuntu-latest
    needs: synth
    steps:
      - uses: actions/checkout@v5

      - name: Install Yosys and build OpenSTA
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys curl cmake autoconf automake libtool git tcl-dev swig bison flex libfl-dev zlib1g-dev libeigen3-dev libgtest-dev
          sudo cmake -S /usr/src/googletest -B /tmp/gtest-build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/gtest-build -j$(nproc)
          sudo cmake --install /tmp/gtest-build
          git clone https://github.com/cuddorg/cudd.git /tmp/cudd
          cd /tmp/cudd
          git checkout 3.0.0
          autoreconf -fi
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          cd -
          git clone --depth 1 --branch "$OPENSTA_REF" https://github.com/The-OpenROAD-Project/OpenSTA.git /tmp/OpenSTA
          cmake -S /tmp/OpenSTA -B /tmp/OpenSTA/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCUDD_DIR=/usr/local
          cmake --build /tmp/OpenSTA/build -j$(nproc) --target sta
          sudo cp /tmp/OpenSTA/build/sta /usr/local/bin/sta
          sta -version

      - name: Run Sky130 STA
        run: make sta-sky130

      - name: Upload STA report artifact
        uses: actions/upload-artifact@v4
        with:
          name: sta-sky130-report
          path: build/sta_sky130_report.txt
          if-no-files-found: error

  openroad-harden:
    name: OpenROAD Sky130 Harden (M8)
    runs-on: ubuntu-latest
    needs: synth
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install micromamba + OpenROAD/Yosys/Magic
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C /tmp bin/micromamba
          export MAMBA_ROOT_PREFIX=$HOME/mamba
          /tmp/bin/micromamba create -y -n or -c litex-hub -c conda-forge openroad yosys magic
          echo "$HOME/mamba/envs/or/bin" >> $GITHUB_PATH

      - name: Run full M8 harden flow
        run: |
          yosys -V
          openroad -version
          magic --version
          # Skip TritonRoute detailed_route in CI (multi-hour on litex-hub OpenROAD).
          make harden HARDEN_DROUTE_ITERS=0
          test -s build/openroad/sisHardenTop.gds
          test -s build/openroad/sisHardenTop.def
          test -s build/openroad/sisHardenTop_pnr.v
          test -s build/openroad/sisHardenTop.sdf
          test -s build/openroad/sisHardenTop_magic_drc.rpt
          test -s build/harden_pnr_report.txt
          test -s build/harden_power.rpt
          echo "=== PnR report ==="
          cat build/harden_pnr_report.txt
          echo "=== DRC (head) ==="
          head -30 build/harden_drc.rpt

      - name: Upload harden artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openroad-harden-sky130
          path: |
            build/openroad/sisHardenTop.gds
            build/openroad/sisHardenTop.def
            build/openroad/sisHardenTop_pnr.v
            build/openroad/sisHardenTop.sdf
            build/openroad/sisHardenTop.spef
            build/openroad/sisHardenTop_pnr_report.txt
            build/openroad/sisHardenTop_power.rpt
            build/openroad/sisHardenTop_magic_drc.rpt
            build/openroad/sisHardenTop_synth_stat.txt
            build/harden_pnr_report.txt
            build/harden_power.rpt
            build/harden_drc.rpt
          if-no-files-found: error
