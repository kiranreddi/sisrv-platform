name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      extended_compliance:
        description: "Run slow A/PMP/privilege ACT and rv32imac+U+PMP co-sim lanes"
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly extended compliance on the default branch after this workflow lands.
    - cron: "17 8 * * *"

permissions:
  contents: read

env:
  SPIKE_REF: 1280c3ca1ef0ce5ec95994cb9b7144f3ea2c655c

jobs:
  lint:
    name: Verilator Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          verilator --version

      - name: Run Lint
        run: make lint

  regress:
    name: Assembly Regression (76 tests + pipeline guards)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          verilator --version

      - name: Install RISC-V Toolchain
        run: sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Run Regression
        run: make regress

      - name: Run Pipeline Throughput Guard
        run: make pipeline-throughput

      - name: Run Fetch-Buffer Throughput Guard
        run: make fetch-throughput

      - name: Run AXI-Lite Regression
        run: make regress-axil

      - name: Run Pipeline Debug Single-step Test
        run: make pipeline-debug

  cocotb:
    name: cocotb Tests (50 tests)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev python3-pip
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          verilator --version

      - name: Install cocotb
        run: pip install cocotb

      - name: Run cocotb Tests
        run: |
          echo "=== cocotb Test Configuration ==="
          echo "Simulator backend: Verilator"
          verilator --version
          echo "DUT top modules: sisAlu, sisRegFile, sisDecode, sisCsr, sisAxiLiteM"
          echo "================================"
          make cocotb

  formal:
    name: Formal Verification (ALU + RegFile + Decoder + AXI-Lite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install SymbiYosys + Yosys + z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3 python3-pip git make
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install

      - name: Run Formal Proofs
        run: make formal

  synth:
    name: Yosys Synthesis
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      - name: Run Synthesis
        run: |
          make synth
          test -s build/ppa_synth_report.txt
          head -40 build/ppa_synth_report.txt

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          verilator --version

      - name: Install RISC-V Toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Run reduced benchmark validation
        run: |
          if command -v riscv64-unknown-elf-gcc >/dev/null; then
            make benchmark-smoke RV_PREFIX=riscv64-unknown-elf-
          else
            make benchmark-smoke
          fi

  cosim-lockstep:
    name: 10k-seed Lock-step Co-sim
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Independent of riscof-act: co-sim is its own functional check (lock-step vs Spike on
    # random programs) and builds its own Spike, so it should not be skipped when the ACT
    # suite is slow. Keep it gated on the fast functional jobs only.
    needs: [regress, cocotb, formal, synth, benchmark-smoke, sta-sky130]
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-cosim
        uses: actions/cache@v4
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          sudo apt-get install -y device-tree-compiler
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.local/spike/bin/spike" ]; then
            "$HOME/.local/spike/bin/spike" --version || true
            exit 0
          fi
          git init /tmp/riscv-isa-sim
          cd /tmp/riscv-isa-sim
          git remote add origin https://github.com/riscv-software-src/riscv-isa-sim.git
          git fetch --depth 1 origin "$SPIKE_REF"
          git checkout FETCH_HEAD
          mkdir build && cd build
          ../configure --prefix="$HOME/.local/spike" --enable-commitlog
          make -j$(nproc)
          make install
          "$HOME/.local/spike/bin/spike" --version || true

      - name: Run 10k-seed lock-step co-sim
        run: make cosim-lockstep COSIM_SEEDS=10000

  cosim-lockstep-imac-upmp:
    name: 10k-seed Lock-step Co-sim (rv32imac + U/PMP)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended_compliance == true)
    needs: [regress, cocotb, formal, synth, benchmark-smoke, sta-sky130]
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-cosim-imac-upmp
        uses: actions/cache@v4
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          sudo apt-get install -y device-tree-compiler
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.local/spike/bin/spike" ]; then
            "$HOME/.local/spike/bin/spike" --version || true
            exit 0
          fi
          git init /tmp/riscv-isa-sim
          cd /tmp/riscv-isa-sim
          git remote add origin https://github.com/riscv-software-src/riscv-isa-sim.git
          git fetch --depth 1 origin "$SPIKE_REF"
          git checkout FETCH_HEAD
          mkdir build && cd build
          ../configure --prefix="$HOME/.local/spike" --enable-commitlog
          make -j$(nproc)
          make install
          "$HOME/.local/spike/bin/spike" --version || true

      - name: Run 10k-seed rv32imac + U/PMP lock-step co-sim
        run: make cosim-lockstep-imac-upmp COSIM_SEEDS=10000

  riscof-act:
    name: RISCOF ACT (I/M/C/Zicsr CI subset, 95 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-riscof
        uses: actions/cache@v4
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          sudo apt-get install -y device-tree-compiler
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.local/spike/bin/spike" ]; then
            "$HOME/.local/spike/bin/spike" --version || true
            exit 0
          fi
          git init /tmp/riscv-isa-sim
          cd /tmp/riscv-isa-sim
          git remote add origin https://github.com/riscv-software-src/riscv-isa-sim.git
          git fetch --depth 1 origin "$SPIKE_REF"
          git checkout FETCH_HEAD
          mkdir build && cd build
          ../configure --prefix="$HOME/.local/spike" --enable-commitlog
          make -j$(nproc)
          make install
          "$HOME/.local/spike/bin/spike" --version || true

      - name: Install RISCOF Python stack
        run: |
          python3 -m venv .venv-riscof
          . .venv-riscof/bin/activate
          pip install -r verification/riscof/requirements.txt

      - name: Run RISCOF rv32imac_zicsr ACT suite
        run: |
          . .venv-riscof/bin/activate
          if command -v riscv64-unknown-elf-gcc >/dev/null; then
            export RV_PREFIX=riscv64-unknown-elf-
          else
            export RV_PREFIX=riscv64-linux-gnu-
          fi
          export RISCOF_TOOLCHAIN_PREFIX="$RV_PREFIX"
          make riscof-check-tools
          make build/sim_sisPlatformTop USE_AXIL=0
          make riscof-act

  riscof-act-full:
    name: RISCOF ACT Full (A/PMP/privilege opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended_compliance == true)
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.038
        run: |
          sudo apt-get update
          sudo apt-get install -y git autoconf g++ flex bison libfl2 libfl-dev help2man make ccache zlib1g-dev
          cd /tmp
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu || true
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf || true

      - name: Cache Spike
        id: cache-spike-riscof-full
        uses: actions/cache@v4
        with:
          path: ~/.local/spike
          key: spike-${{ runner.os }}-${{ env.SPIKE_REF }}

      - name: Install Spike (reference model)
        run: |
          sudo apt-get install -y device-tree-compiler
          echo "$HOME/.local/spike/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.local/spike/bin/spike" ]; then
            "$HOME/.local/spike/bin/spike" --version || true
            exit 0
          fi
          git init /tmp/riscv-isa-sim
          cd /tmp/riscv-isa-sim
          git remote add origin https://github.com/riscv-software-src/riscv-isa-sim.git
          git fetch --depth 1 origin "$SPIKE_REF"
          git checkout FETCH_HEAD
          mkdir build && cd build
          ../configure --prefix="$HOME/.local/spike" --enable-commitlog
          make -j$(nproc)
          make install
          "$HOME/.local/spike/bin/spike" --version || true

      - name: Install RISCOF Python stack
        run: |
          python3 -m venv .venv-riscof
          . .venv-riscof/bin/activate
          pip install -r verification/riscof/requirements.txt

      - name: Run full RISCOF rv32imac_zicsr ACT suite
        run: |
          . .venv-riscof/bin/activate
          if command -v riscv64-unknown-elf-gcc >/dev/null; then
            export RV_PREFIX=riscv64-unknown-elf-
          else
            export RV_PREFIX=riscv64-linux-gnu-
          fi
          export RISCOF_TOOLCHAIN_PREFIX="$RV_PREFIX"
          make riscof-check-tools
          make build/sim_sisPlatformTop USE_AXIL=0
          make riscof-act-full

  sta-sky130:
    name: Sky130 STA (WNS/TNS/Fmax)
    runs-on: ubuntu-latest
    needs: synth
    steps:
      - uses: actions/checkout@v4

      - name: Install Yosys and build OpenSTA
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys curl cmake autoconf automake libtool git tcl-dev swig bison flex libfl-dev zlib1g-dev libeigen3-dev libgtest-dev
          sudo cmake -S /usr/src/googletest -B /tmp/gtest-build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/gtest-build -j$(nproc)
          sudo cmake --install /tmp/gtest-build
          git clone https://github.com/cuddorg/cudd.git /tmp/cudd
          cd /tmp/cudd
          git checkout 3.0.0
          autoreconf -fi
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          cd -
          git clone --depth 1 https://github.com/The-OpenROAD-Project/OpenSTA.git /tmp/OpenSTA
          cmake -S /tmp/OpenSTA -B /tmp/OpenSTA/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCUDD_DIR=/usr/local
          cmake --build /tmp/OpenSTA/build -j$(nproc) --target sta
          sudo cp /tmp/OpenSTA/build/sta /usr/local/bin/sta
          sta -version

      - name: Run Sky130 STA
        run: make sta-sky130
